[dench]
cite = "Dench, Pineda-Torres & Myers (2023)"
title = "The Effects of the Dobbs Decision on Fertility"
author = "Daniel Dench, Mayra Pineda-Torres and Caitlin Knowles Myers"
publisher = "IZA Discussion Paper No. 16608"
year = 2023
url = "https://www.iza.org/publications/dp/16608"
where = "abstract"
quote = "We provide the first estimates of the effects of this decision on fertility using a pre-registered synthetic difference-in-differences design applied to newly released provisional natality data for the first half of 2023. The results indicate that states with abortion bans experienced an average increase in births of 2.3 percent relative to states where abortion was not restricted."
accessed = "2026-10-08"
note = "Only the abstract has been read. The births are those of the first half of 2023, before most of the growth in pills sent by post: look for later estimates, and for the published version of this paper, before using the number."

