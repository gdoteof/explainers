[taxbreaks]
cite = "US Treasury, Tax Expenditures (2025)"
title = "Tax Expenditures, Fiscal Year 2027"
publisher = "US Department of the Treasury, Office of Tax Analysis"
year = 2025
url = "https://home.treasury.gov/system/files/131/Tax-Expenditures-FY2027.pdf"
where = "pp. 1-2, and Table 3 (p. 32) and, for energy and agriculture, Table 1; the column for fiscal 2025, in millions of dollars; dated 16 December 2025"
quote = [
    "Tax expenditures are defined in the law as “revenue losses attributable to provisions of the federal tax laws which allow a special exclusion, exemption, or deduction from gross income or which provide a special credit, a preferential rate of tax, or a deferral of tax liability.’’ These exceptions may be viewed as alternatives to other policy instruments, such as spending or regulatory programs.",
    "The estimates would be different if tax expenditures were changed simultaneously because of potential interactions among provisions. For that reason, this document does not present a grand total for the estimated tax expenditures.",
    "The location of the estimates under the corporate and individual headings does not imply that these categories of filers benefit from the special tax provisions in proportion to the respective tax expenditure amounts shown.",
    "The estimates shown for individual tax expenditures in Tables 1 through 3 do not necessarily equal the increase in federal receipts (or the change in the budget balance) that would result from repealing these special provisions",
    "The ultimate beneficiaries of corporate tax expenditures could be shareholders, employees, customers, or other providers of capital, depending on economic forces.",
    "under current law, employer-paid health insurance premiums and other medical expenses (including long-term care or Health Reimbursement Arrangements) are not included in employee gross income even though they are deducted as a business expense by the employer.",
    "In addition, the employer contributions for health have effects on payroll tax receipts (in millions of dollars) as follows: 2025 $171,400",
    "Exclusion of employer contributions for medical insurance premiums and medical care 279,180",
    "Exclusion of net imputed rental income 151,640",
    "Defined contribution employer plans 142,820",
    "Capital gains (except agriculture, timber, iron ore, and coal) 134,600",
    "Capital gains exclusion on home sales 79,170",
    "Allow 20-percent deduction to certain pass-through income 64,680",
    "Deductibility of charitable contributions, other than education and health 51,360",
    "Accelerated depreciation of machinery and equipment (normal tax method) 47,660",
    "Step-up basis of capital gains at death 36,430",
    "Credit for increasing research activities 36,060",
    "Deductibility of mortgage interest on owner-occupied homes 23,880",
    "Energy investment credit 1/ 19,980",
    "Energy production credit 1/ 9,850",
    "Capital gains treatment of certain agriculture income 2,020",
]
accessed = "2026-10-08"
note = "Estimates, each made as if nothing else in the tax code changed. Table 3 ranks by the ten years 2026-2035, so the order by 2025 alone differs a little. The health-insurance break is all in the table for individuals (2B) and is 0 in the table for corporations (2A); its effect on payroll taxes is given in a footnote and is not in the 279,180. The opening pages and Table 3 have been read; the descriptions of each provision have not. “Net imputed rental income” is the rent a homeowner does not pay himself: explain it or leave it out."

