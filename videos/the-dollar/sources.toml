[bailey]
cite = "Bailey, Hoynes, Rossin-Slater & Walker, NBER (2020)"
title = "Is the Social Safety Net a Long-Term Investment? Large-Scale Evidence from the Food Stamps Program"
author = "Martha J. Bailey, Hilary W. Hoynes, Maya Rossin-Slater and Reed Walker"
publisher = "National Bureau of Economic Research, Working Paper 26942"
year = 2020
url = "https://www.nber.org/papers/w26942"
quote = [
    "We use novel, large-scale data on 43 million Americans from the 2000 Census and the 2001 to 2013 American Communities Survey linked to the Social Security Administration’s NUMIDENT to study how a policy-driven increase in economic resources for families affects children’s long-term outcomes.",
    "Using variation from the county-level roll-out of the Food Stamps program between 1961 and 1975, we find that children with access to greater economic resources before age five experience an increase of 6 percent of a standard deviation in their adult human capital, 3 percent of a standard deviation in their adult economic self-sufficiency, 8 percent of a standard deviation in the quality of their adult neighborhoods, 0.4 percentage-point increase in longevity, and a 0.5 percentage-point decrease in likelihood of being incarcerated.",
    "Based on these estimates, we conclude that Food Stamps’ transfer of resources to families is a highly cost-effective investment into young children",
]
accessed = "2026-10-08"
note = "One study, and a working paper: the abstract has been read, not the paper, and not what its critics say. It compares children born in counties that had food stamps yet with children born in counties that did not, in the 1960s and 70s, so it is about that roll-out and not today's programme. The effects are small for each child and averaged over many."

