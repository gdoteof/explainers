[project]
name = "explainers"
version = "0.1.0"
description = "Tooling for narrated explainer videos where every claim is labelled and sourced"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "pillow>=11",
    "skia-python>=138",
]

[project.optional-dependencies]
voice = [
    "en-core-web-sm",
    "kokoro>=0.9.4",
    "num2words>=0.5.14",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.7",
    "transformers>=4.50",
]
manim = [
    "manim>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explainers"]

# The voice runs fine on CPU, which leaves the GPU alone.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
